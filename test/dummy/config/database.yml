# Multi-database support with environment variable switching
# Set DB in your .env file to switch between databases
#
# DB=sqlite3 (default)
# DB=postgresql
# DB=mysql

<%
  adapter = ENV.fetch('DB', 'sqlite3')
  database_config = case adapter
  when 'postgresql'
    {
      adapter: 'postgresql',
      encoding: 'unicode',
      pool: ENV.fetch("RAILS_MAX_THREADS") { 5 },
      username: ENV.fetch('POSTGRES_USERNAME', 'postgres'),
      password: ENV.fetch('POSTGRES_PASSWORD', ''),
      host: ENV.fetch('POSTGRES_HOST', 'localhost'),
      port: ENV.fetch('POSTGRES_PORT', 5432)
    }
  when 'mysql', 'mysql2'
    mysql_config = {
      adapter: 'mysql2',
      encoding: 'utf8mb4',
      pool: ENV.fetch("RAILS_MAX_THREADS") { 5 },
      username: ENV.fetch('MYSQL_USERNAME', 'root'),
      password: ENV.fetch('MYSQL_PASSWORD', ''),
      host: ENV.fetch('MYSQL_HOST', '127.0.0.1'),
      port: ENV.fetch('MYSQL_PORT', 3306).to_i,
      connect_timeout: 30,
      read_timeout: 30,
      write_timeout: 30
    }
    mysql_config
  else # sqlite3
    {
      adapter: 'sqlite3',
      pool: ENV.fetch("RAILS_MAX_THREADS") { 5 },
      timeout: 5000
    }
  end
%>

default: &default
  <% database_config.each do |key, value| %>
  <%= key %>: <%= value %>
  <% end %>

development:
  <<: *default
  <% if adapter == 'sqlite3' %>
  database: storage/development.sqlite3
  <% elsif adapter == 'postgresql' %>
  database: <%= ENV.fetch('POSTGRES_DATABASE', 'rails_pulse_development') %>
  <% elsif adapter == 'mysql' || adapter == 'mysql2' %>
  database: <%= ENV.fetch('MYSQL_DATABASE', 'rails_pulse_development') %>
  <% else %>
  database: rails_pulse_development
  <% end %>
  rails_pulse:
    <<: *default
    database: storage/development_rails_pulse.sqlite3
    migrations_paths: db/rails_pulse_migrate
    schema_dump: false

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
<%
  test_database = case adapter
  when 'postgresql'       then ENV.fetch('POSTGRES_TEST_DATABASE', 'rails_pulse_test')
  when 'mysql', 'mysql2'  then ENV.fetch('MYSQL_TEST_DATABASE', 'rails_pulse_test')
  else 'storage/test.sqlite3'
  end
  test_rails_pulse_database = case adapter
  when 'postgresql'       then ENV.fetch('POSTGRES_TEST_RAILS_PULSE_DATABASE', 'rails_pulse_test_rails_pulse')
  when 'mysql', 'mysql2'  then ENV.fetch('MYSQL_TEST_RAILS_PULSE_DATABASE', 'rails_pulse_test_rails_pulse')
  else 'storage/test_rails_pulse.sqlite3'
  end
%>
<% if ENV['RAILS_PULSE_SEPARATE_DATABASE'] == 'true' %>
# Two real databases, as a host with config.connects_to has. Used by
# bin/test_separate_database_upgrade; the dummy initializer sets connects_to
# from the same variable.
test:
  primary:
    <<: *default
    database: <%= test_database %>
  rails_pulse:
    <<: *default
    database: <%= test_rails_pulse_database %>
    migrations_paths: db/rails_pulse_migrate
    schema_dump: false
<% else %>
# One database. The nested rails_pulse entry is not a second database here (a
# config with a `database` key is a single one); it is what the upgrade
# generator's auto-detection and the db:prepare hook look for.
test:
  <<: *default
  database: <%= test_database %>
  rails_pulse:
    <<: *default
    database: <%= test_rails_pulse_database %>
    migrations_paths: db/rails_pulse_migrate
    schema_dump: false
<% end %>

production:
  <<: *default
  <% if adapter == 'sqlite3' %>
  database: storage/production.sqlite3
  <% elsif adapter == 'postgresql' %>
  database: <%= ENV.fetch('POSTGRES_PRODUCTION_DATABASE', 'rails_pulse_production') %>
  <% elsif adapter == 'mysql' || adapter == 'mysql2' %>
  database: <%= ENV.fetch('MYSQL_PRODUCTION_DATABASE', 'rails_pulse_production') %>
  <% else %>
  database: rails_pulse_production
  <% end %>
